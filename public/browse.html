<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse Listings - Hartahub</title>
<meta name="description" content="Browse property listings shared by co-broking agents across Malaysia, filterable by state, property type, and budget." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="browse">
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Harta<span>hub</span></a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-links" class="nav-links"></nav>
    </div>
  </header>
  <div id="nav-scrim" class="nav-scrim"></div>

  <main id="main" class="container page">
    <h1>Browse Listings</h1>
    <p class="page-subtitle">All properties shared by agents on Hartahub.</p>

    <div class="filter-bar">
      <select id="filter-state">
        <option value="">All States</option>
      </select>
      <select id="filter-type">
        <option value="">All Property Types</option>
      </select>
      <input type="text" id="filter-area" placeholder="Area / Town" />
      <input type="number" id="filter-price-min" placeholder="Min Price (RM)" min="0" />
      <input type="number" id="filter-price-max" placeholder="Max Price (RM)" min="0" />
      <button id="filter-clear" class="btn btn-secondary">Clear Filters</button>
    </div>

    <div id="listings-list" class="card-list">
      <div class="skeleton-list">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
